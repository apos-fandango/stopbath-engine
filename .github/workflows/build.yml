# StopBath engine helper: built on GitHub's Windows machines from ART's own source (the same way ART builds its
# Windows release: ART's .github/workflows/windows.yml), with the helper added beside ART-cli.
name: Build the engine helper

on:
  push:
  workflow_dispatch:

env:
  ART_VERSION: "1.26.10"   # the ART release the helper is built from (StopBath's ART)

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: This repository (the helper)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: ART's source
        uses: actions/checkout@v4
        with:
          repository: artraweditor/ART
          ref: ${{ env.ART_VERSION }}
          path: art

      - name: Install base msys2
        uses: msys2/setup-msys2@v2
        with:
          location: C:\msys2
          update: true
          msystem: UCRT64
          install: |
            git
            wget
            xz
            p7zip

      - name: Install MSYS2 packages (ART's own set)
        run: |
          export ART_COMPILER=gcc
          export ART_MSYS2_REPO=ucrt64
          export ART_PKG_PREFIX=mingw-w64-ucrt-x86_64
          export ART_MSYS2_REPO_VER=1.0.2
          wget https://github.com/artraweditor/msys2-repo/releases/download/${ART_MSYS2_REPO_VER}/repo-${ART_MSYS2_REPO}.tar
          tar xf repo-${ART_MSYS2_REPO}.tar
          echo "[options]" > /etc/pacman.conf
          echo "HoldPkg     = pacman" >> /etc/pacman.conf
          echo "Architecture = auto" >> /etc/pacman.conf
          echo "SigLevel    = Required" >> /etc/pacman.conf
          echo "LocalFileSigLevel = Optional" >> /etc/pacman.conf
          echo "[msys]" >> /etc/pacman.conf
          echo "Include = /etc/pacman.d/mirrorlist.msys" >> /etc/pacman.conf
          echo "[custom-${ART_MSYS2_REPO}]" >> /etc/pacman.conf
          echo "SigLevel = Optional TrustAll" >> /etc/pacman.conf
          echo "Server = file://${PWD}/repo-${ART_MSYS2_REPO}" >> /etc/pacman.conf
          pacman -Sy
          for p in ${ART_COMPILER} cmake autotools ninja gtkmm3 lcms2 fftw lensfun mimalloc opencolorio vulkan-headers shaderc; do
              pacman --noconfirm -S custom-${ART_MSYS2_REPO}/${ART_PKG_PREFIX}-${p}
          done

      - name: Install exiv2
        run: |
          wget https://github.com/Exiv2/exiv2/releases/download/v0.27.7/exiv2-0.27.7-Source.tar.gz
          tar xzf exiv2-0.27.7-Source.tar.gz
          mkdir build-exiv2
          cd build-exiv2
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=c:/msys2/msys64/usr/local \
            -DEXIV2_ENABLE_WIN_UNICODE=1 -DEXIV2_ENABLE_BMFF=1 ../exiv2-0.27.7-Source
          ninja install

      - name: Install LibRaw
        run: |
          git clone --depth 1 https://github.com/LibRaw/LibRaw.git
          cd LibRaw
          autoreconf -i
          export CC=gcc
          export CXX=g++
          CPPFLAGS=-DUSE_X3FTOOLS ./configure --prefix=c:/msys2/msys64/usr/local
          make -j
          make install

      - name: Install CTL
        run: |
          git clone --depth 1 https://github.com/ampas/CTL.git
          mkdir build-CTL
          cd build-CTL
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=c:/msys2/msys64/usr/local \
            -DCMAKE_CXX_FLAGS="-fpermissive -fms-extensions" -DCTL_BUILD_TESTS=0 -DCTL_BUILD_TOOLS=0 ../CTL
          ninja install

      - name: Add the helper to ART's build
        run: |
          cp repo/helper/stopbath-engine.cc art/src/gui/
          cat repo/helper/helper.cmake >> art/src/gui/CMakeLists.txt

      - name: Configure
        run: |
          mkdir build
          cd build
          export PKG_CONFIG_PATH=c:/msys2/msys64/usr/local/lib/pkgconfig
          cmake -GNinja -DCMAKE_BUILD_TYPE=Release -DENABLE_LIBRAW=1 -DENABLE_OCIO=1 -DENABLE_CTL=1 \
            -DCTL_INCLUDE_DIR=/usr/local/include/CTL -DCMAKE_LIBRARY_PATH=/usr/local/lib \
            -DBUILD_BUNDLE=1 -DENABLE_SIMDE=0 -DENABLE_VULKAN=1 ../art

      - name: Build
        run: |
          cd build
          ninja install

      - name: Lens data
        run: lensfun-update-data

      - name: Bundle (the helper with the files it needs)
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd build/Release
          python ../../art/tools/win/bundle_ART.py -o ../../bundle -v -I -m c:/msys2/msys64
          cd ../..
          test -f bundle/stopbath-engine.exe || cp build/Release/stopbath-engine.exe bundle/
          cp repo/LICENSE bundle/STOPBATH-ENGINE-LICENSE.txt
          cp repo/README.md bundle/STOPBATH-ENGINE-README.md

      - name: Try it
        run: |
          cd bundle
          ./stopbath-engine.exe --version
          ./stopbath-engine.exe --render ../art/data/images/png/ART-logo-256.png ../test.jpg --repeat 3
          test -f ../test.jpg && echo "test picture made"

      - name: Keep the result (download it from this run's page)
        uses: actions/upload-artifact@v4
        with:
          name: stopbath-engine-windows-x64
          path: bundle
          retention-days: 30
